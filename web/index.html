
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Java IDS Dashboard</title>

    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
</head>

<body>
    <header>
        <h1>Intrusion Detection System</h1>
        <p>Network Security Monitoring Dashboard</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Welcome to the IDS Dashboard</h2>
            <p>
                Monitor network events, review security alerts,
                and analyze suspicious network activity.
            </p>

            <button id="statusButton">
                Check Dashboard Status
            </button>

            <p id="statusMessage"></p>
        </section>
    </main>
</body>
</html>
